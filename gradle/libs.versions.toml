[versions]
ktor = "3.6.1"
mybatis-plus = "3.5.18.1"
kotlin = "2.4.21"
spring-boot = "4.1.2"
agentscope = "2.0.4"
minio = "9.0.3"
aliyun-oss = "3.18.5"
apache-poi = "6.0.0"
hutool = "5.8.48"
jsoup = "1.24.1"

[libraries]
mybatis-plus-core = { module = "com.baomidou:mybatis-plus-core", version.ref = "mybatis-plus" }
mybatis-plus-extension = { module = "com.baomidou:mybatis-plus-extension", version.ref = "mybatis-plus" }
mybatis-plus-jsqlparser = { module = "com.baomidou:mybatis-plus-jsqlparser", version.ref = "mybatis-plus" }
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
agentscope-harness = { module = "io.agentscope:agentscope-harness", version.ref = "agentscope" }
agentscope-model-openai = { module = "io.agentscope:agentscope-extensions-model-openai", version.ref = "agentscope" }
minio = { module = "io.minio:minio", version.ref = "minio" }
aliyun-oss = { module = "com.aliyun.oss:aliyun-sdk-oss", version.ref = "aliyun-oss" }
apache-poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "apache-poi" }
hutool-all = { module = "cn.hutool:hutool-all", version.ref = "hutool" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

[plugins]
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
