# 公共配置。默认加载 application-dev.yaml；生产环境设置 SPRING_PROFILES_ACTIVE=prod。
spring:
  application:
    name: ZeroKotlin
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    # 选用 zero-core-jpa 变体时仍由 Flyway 管理表结构。
    hibernate:
      ddl-auto: none

server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    persist-authorization: false

zero:
  database:
    # auto 按 PostgreSQL、MySQL、SQLite 的顺序选择，仅探测已配置 URL 的远端库。
    mode: auto
    probe-timeout: 1s
    # 以下两组均为可选。只配置实际使用的数据库，url 中不要包含凭据。
    # postgresql:
    #   url: ${ZERO_DATABASE_POSTGRESQL_URL}
    #   username: ${ZERO_DATABASE_POSTGRESQL_USERNAME}
    #   password: ${ZERO_DATABASE_POSTGRESQL_PASSWORD}
    # mysql:
    #   url: ${ZERO_DATABASE_MYSQL_URL}
    #   username: ${ZERO_DATABASE_MYSQL_USERNAME}
    #   password: ${ZERO_DATABASE_MYSQL_PASSWORD}
  cache:
    # auto 在无 Redis 地址时直接使用 Caffeine。mode=redis 时要求 Redis 可用。
    mode: auto
    ttl: 10m
    caffeine:
      maximum-size: 10000
    redis:
      # 通过 ZERO_CACHE_REDIS_HOST 配置地址；使用 ACL 时同时提供用户名和密码。
      # host: ${ZERO_CACHE_REDIS_HOST}
      # username: ${ZERO_CACHE_REDIS_USERNAME}
      # password: ${ZERO_CACHE_REDIS_PASSWORD}
      port: 6379
      database: 0
      tls: false
      timeout: 2s
  files:
    mode: local
    # 启用对象存储时提供完整配置并选择 mode。旧文件仍需原存储位置。
    # minio:
    #   endpoint: ${ZERO_FILES_MINIO_ENDPOINT}
    #   bucket: ${ZERO_FILES_MINIO_BUCKET}
    #   access-key: ${ZERO_FILES_MINIO_ACCESSKEY}
    #   secret-key: ${ZERO_FILES_MINIO_SECRETKEY}
    #   region: us-east-1
    # aliyun:
    #   endpoint: ${ZERO_FILES_ALIYUN_ENDPOINT}
    #   bucket: ${ZERO_FILES_ALIYUN_BUCKET}
    #   region: ${ZERO_FILES_ALIYUN_REGION}
    #   access-key: ${ZERO_FILES_ALIYUN_ACCESSKEY}
    #   secret-key: ${ZERO_FILES_ALIYUN_SECRETKEY}
  search:
    # 使用 Gradle -PwithSearch=true 装配后，再设置 ZERO_SEARCH_ENABLED=true。
    enabled: false
    url: http://localhost:9200
    index: zero-example
    timeout: 5s
    # api-key: ${ZERO_SEARCH_APIKEY}
  kafka:
    # 使用 Gradle -PwithKafka=true 装配后，再设置 ZERO_KAFKA_ENABLED=true。
    enabled: false
    bootstrap-servers: [localhost:9092]
    topic: zero-example
    group-id: zero-example
    timeout: 8s
    client-properties: {}
    # 使用 SASL 时，将上面的空映射替换为所需的客户端属性，例如：
    # client-properties:
    #   "[security.protocol]": SASL_SSL
    #   "[sasl.mechanism]": SCRAM-SHA-512
    #   "[sasl.jaas.config]": ${ZERO_KAFKA_SASL_JAAS_CONFIG}
  system:
    # 在空用户表中创建首个管理员时，同时设置以下两个环境变量，密码至少 12 个字符。
    admin:
      username: ${ZERO_SYSTEM_ADMIN_USERNAME:}
      password: ${ZERO_SYSTEM_ADMIN_PASSWORD:}
    session:
      seconds: 28800
    captcha:
      ttl-seconds: 120
  security:
    rate-limit:
      enabled: true
    xss:
      parameter-names: []
      exclude-paths: []
  observability:
    ip-region:
      # 路径留空时仍保存对端 IP。提供对应地址族的离线 xdb 后可记录归属地。
      ipv4-path: ''
      ipv6-path: ''
    request-audit:
      enabled: true
      include-user-agent: false
