ktor {
    application {
        modules = [dev.zerokotlin.ktor.ApplicationKt.module]
    }
    deployment {
        host = "127.0.0.1"
        host = ${?ZERO_HOST}
        port = 8080
        port = ${?ZERO_PORT}
    }
}

app {
    name = "ZeroKotlin"
    contextPath = "/"
}

zero {
    databaseMode = "auto"
    databaseMode = ${?ZERO_DATABASE_MODE}
    postgresqlUrl = ${?ZERO_DATABASE_POSTGRESQL_URL}
    postgresqlUsername = ${?ZERO_DATABASE_POSTGRESQL_USERNAME}
    postgresqlPassword = ${?ZERO_DATABASE_POSTGRESQL_PASSWORD}
    mysqlUrl = ${?ZERO_DATABASE_MYSQL_URL}
    mysqlUsername = ${?ZERO_DATABASE_MYSQL_USERNAME}
    mysqlPassword = ${?ZERO_DATABASE_MYSQL_PASSWORD}
    databasePath = "data/zero-ktor.db"
    databasePath = ${?ZERO_DATABASE_SQLITE_PATH}
    filesMode = "local"
    filesMode = ${?ZERO_FILES_MODE}
    minioEndpoint = ${?ZERO_FILES_MINIO_ENDPOINT}
    minioBucket = ${?ZERO_FILES_MINIO_BUCKET}
    minioAccessKey = ${?ZERO_FILES_MINIO_ACCESSKEY}
    minioSecretKey = ${?ZERO_FILES_MINIO_SECRETKEY}
    minioRegion = ${?ZERO_FILES_MINIO_REGION}
    aliyunEndpoint = ${?ZERO_FILES_ALIYUN_ENDPOINT}
    aliyunBucket = ${?ZERO_FILES_ALIYUN_BUCKET}
    aliyunAccessKey = ${?ZERO_FILES_ALIYUN_ACCESSKEY}
    aliyunSecretKey = ${?ZERO_FILES_ALIYUN_SECRETKEY}
    aliyunRegion = ${?ZERO_FILES_ALIYUN_REGION}
    filesPath = "data/ktor-files"
    filesPath = ${?ZERO_FILES_LOCAL_PATH}
    sessionSeconds = 28800
    sessionSeconds = ${?ZERO_SYSTEM_SESSION_SECONDS}
    apiDocsEnabled = true
    apiDocsEnabled = ${?ZERO_API_DOCS_ENABLED}
    sanitizeText = false
    sanitizeText = ${?ZERO_SECURITY_XSS_ENABLED}
    cacheMode = "auto"
    cacheMode = ${?ZERO_CACHE_MODE}
    redisHost = ${?ZERO_CACHE_REDIS_HOST}
    redisPort = 6379
    redisPort = ${?ZERO_CACHE_REDIS_PORT}
    redisUsername = ${?ZERO_CACHE_REDIS_USERNAME}
    redisPassword = ${?ZERO_CACHE_REDIS_PASSWORD}
    redisDatabase = 0
    redisDatabase = ${?ZERO_CACHE_REDIS_DATABASE}
    redisTls = false
    redisTls = ${?ZERO_CACHE_REDIS_TLS}
    redisKeyPrefix = "zero-ktor:"
    redisKeyPrefix = ${?ZERO_CACHE_REDIS_KEY_PREFIX}
    captchaEnabled = false
    captchaEnabled = ${?ZERO_SYSTEM_CAPTCHA_ENABLED}
    captchaTtlSeconds = 120
    captchaTtlSeconds = ${?ZERO_SYSTEM_CAPTCHA_TTL_SECONDS}
}

extensions {
    businessModules = ${?ZERO_BUSINESS_MODULES}
    searchEnabled = false
    searchEnabled = ${?ZERO_SEARCH_ENABLED}
    searchUrl = "http://127.0.0.1:9200"
    searchUrl = ${?ZERO_SEARCH_URL}
    searchIndex = "zero-documents"
    searchIndex = ${?ZERO_SEARCH_INDEX}
    searchApiKey = ${?ZERO_SEARCH_API_KEY}
    kafkaEnabled = false
    kafkaEnabled = ${?ZERO_KAFKA_ENABLED}
    kafkaBootstrapServers = "127.0.0.1:9092"
    kafkaBootstrapServers = ${?ZERO_KAFKA_BOOTSTRAP_SERVERS}
    kafkaTopic = "zero-example"
    kafkaTopic = ${?ZERO_KAFKA_TOPIC}
    kafkaGroupId = "zero-example"
    kafkaGroupId = ${?ZERO_KAFKA_GROUP_ID}
    kafkaTimeoutSeconds = 8
    kafkaTimeoutSeconds = ${?ZERO_KAFKA_TIMEOUT_SECONDS}
    kafkaClientProperties {}
}
